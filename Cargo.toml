[package]
name = "nviwatch"
version = "0.2.1"
edition = "2021"
description = "A blazingly fast Rust-based TUI for managing and monitoring NVIDIA GPU processes"
license = "GPL-3.0"
authors = ["Manpreet Singh Minhas <msminhas@uwaterloo.ca>"]
repository = "https://github.com/msminhas93/nviwatch"
homepage = "https://github.com/msminhas93/nviwatch"
documentation = "https://github.com/msminhas93/nviwatch#readme"
readme = "README.md"
keywords = ["nvidia", "gpu", "monitoring", "tui", "system-monitor"]
categories = ["command-line-utilities", "visualization", "hardware-support"]

[dependencies]
clap = "4.5.45"
crossterm = "0.29.0"
nvml-wrapper = "0.11.0"
prettytable-rs = "0.10.0"
ratatui = "0.29.0"
textwrap = "0.16.2"
influxdb = { version = "0.7.2", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }

# Cross-platform dependencies
crossbeam = "0.8"
sysinfo = "0.29"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", features = ["process", "signal", "user"] }
procfs = "0.17.0"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation"
] }

# macOS-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
